routes:
  - match:
      headers:
        - name: :method
          string_match:
            safe_regex:
              regex: ^(DELETE|GET|HEAD|OPTIONS|PATCH|POST|PUT)$
        - name: :path
          string_match:
            safe_regex:
              regex: ^/ws/test/[^?#]+(?:\?[^#]*)?$
      prefix: /ws/test/
    route:
      append_x_forwarded_host: true
      cluster: clustertest
      host_rewrite_literal: host
      prefix_rewrite: /test1
      timeout: 30s
    typed_per_filter_config:
      api_key_auth:
        '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
        disabled: true
      envoy.filters.http.basic_auth:
        '@type': type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuthPerRoute
        users:
          inline_string: |-
            test:{SHA}qUqP5cyxm6YcTAhz05Hph5gvu9M=
            test2:{SHA}EJ9LPFDXsN9ynSmbxvjp75Bmlx8=
            test3:{SHA}Pr+jAdxZGW8YWTxF5RkoeiMpdYk=
clusters:
  - common_lb_config:
      healthy_panic_threshold:
        value: 0
    connect_timeout: 15.000s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: clustertest
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: hostanme
                    port_value: 8080
                hostname: hostanme
    name: clustertest
    outlier_detection:
      base_ejection_time: 10.000000s
      consecutive_5xx: 5
      max_ejection_percent: 100
      max_ejection_time: 60.000000s
    per_connection_buffer_limit_bytes: 32768
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_params:
            tls_maximum_protocol_version: TLSv1_3
            tls_minimum_protocol_version: TLSv1_2
          validation_context:
            trusted_ca:
              filename: /test/cert.crt
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        auto_config:
          http_protocol_options: {}
          http2_protocol_options: {}
listeners: []
endpoints: []
